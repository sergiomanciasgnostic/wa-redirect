<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sergiomancias Gnostic - Verificación</title>
  <style>
    /* ... (Mantén tus estilos CSS anteriores aquí) ... */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #442565; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .container { display: flex; flex-wrap: wrap; gap: 20px; max-width: 850px; width: 100%; justify-content: center; }
    .card { background: #3a1f57; border: 1px solid rgba(255,106,0,0.3); padding: 30px; flex: 1; min-width: 320px; border-radius: 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center; }
    .info-panel { background: rgba(255, 255, 255, 0.05); border-radius: 12px; padding: 20px; text-align: left; width: 100%; }
    .sigilo { width: 80px; margin-bottom: 15px; }
    h2 { font-size: 22px; color: #FF6A00; margin-bottom: 15px; }
    h3 { font-size: 14px; color: #FF6A00; text-transform: uppercase; margin-bottom: 10px; border-bottom: 1px solid rgba(255,106,0,0.3); padding-bottom: 5px; }
    .data-list { list-style: none; font-size: 14px; color: #d4b8f0; }
    .data-list li { margin-bottom: 8px; display: flex; justify-content: space-between; }
    .data-list span { color: #fff; font-weight: 500; text-align: right; }
    .btn-wa { display: inline-flex; align-items: center; justify-content: center; background-color: #25D366; color: white; text-decoration: none; font-weight: bold; font-size: 17px; padding: 14px 28px; border-radius: 50px; margin-top: 20px; width: 100%; transition: 0.3s; }
    .btn-wa:hover { background-color: #1ebe57; transform: translateY(-2px); }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <h3>Verifica tus datos</h3>
      <div class="info-panel">
        <ul class="data-list" id="preview-list"></ul>
      </div>
    </div>

    <div class="card">
      <img class="sigilo" src="https://static.wixstatic.com/media/4c70c8_89b322a9983548539f2997a6cec3cf3b~mv2.png" />
      <h2>¡Casi listo!</h2>
      <p style="color:#d4b8f0; font-size:14px; margin-bottom:20px;">Redirigiendo a WhatsApp para coordinar...</p>
      <a id="waBtn" class="btn-wa" href="#">Abrir WhatsApp</a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const d = (key) => decodeURIComponent(params.get(key) || '').replace(/\+/g, ' ').trim();

    function iniciar() {
      const nombre = d('nom');
      const apellido = d('ape');
      const mancia = d('man');
      
      if (!nombre || !mancia) {
        document.body.innerHTML = "<h2>Error: No se recibieron datos. Vuelve a la página anterior e inténtalo de nuevo.</h2>";
        return;
      }

      const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
      const nombreMes = meses[parseInt(d('mes')) - 1] || '';
      
      // Mostrar lista en pantalla
      const lista = document.getElementById('preview-list');
      lista.innerHTML = `
        <li>Nombre: <span>${nombre} ${apellido}</span></li>
        <li>Nacimiento: <span>${d('dia')} de ${nombreMes} de ${d('anio')}</span></li>
        <li>Numerología: <span>${d('num')}</span></li>
        <li>Servicio: <span>${mancia}</span></li>
      `;

      // Construir mensaje de WhatsApp igual al original
      const despedida = d('sexo') === 'H' ? 'Estoy listo para coordinar mi lectura, gracias.' : 'Estoy lista para coordinar mi lectura, gracias.';
      let msg = `Hola, Sergiomancias Gnostic.\n¡Pago confirmado!\nAquí están mis datos:\n\n`;
      msg += `*Datos personales*\n_${nombre} ${apellido}_\n`;
      msg += `Nací el ${d('dia')} de ${nombreMes} de ${d('anio')}\n`;
      msg += `Mi numerología es ${d('num')}\n`;
      if (d('zod')) msg += `Soy del signo ${d('zod')}\n`;
      msg += `\n*Datomancia*\n${mancia}\n`;
      if (d('ext')) msg += `2x1 con: ${d('ext')}\n`;
      msg += `Duración de la lectura: ${d('min')} minutos\n`;
      
      if (mancia.includes('Astrología') || d('ext').includes('Astrología')) {
        msg += `\n*Datos de Astrología*\nLugar: ${d('ciu')}, ${d('pro')}, ${d('pai')}\nHora: ${d('hor')}\n`;
      }
      msg += `\n${despedida}`;

      const finalUrl = /Android|iPhone|iPad/i.test(navigator.userAgent)
        ? `https://api.whatsapp.com/send?phone=59894140917&text=${encodeURIComponent(msg)}`
        : `https://web.whatsapp.com/send?phone=59894140917&text=${encodeURIComponent(msg)}`;

      const btn = document.getElementById('waBtn');
      btn.href = finalUrl;

      // Redirección automática a los 3 segundos
      setTimeout(() => { window.location.href = finalUrl; }, 3000);
    }

    window.onload = iniciar;
  </script>
</body>
</html>
