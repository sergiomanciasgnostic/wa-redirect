<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Confirmación de Lectura – Sergiomancias Gnostic</title>
    <style>
        :root {
            --gold: #FF6A00;
            --dark: #442565;
        }
        body { 
            background: var(--dark); 
            color: white; 
            font-family: Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0;
            text-align: center;
        }
        .card {
            background: #3a1f57;
            padding: 30px;
            border: 1px solid rgba(255,106,0,0.3);
            border-radius: 12px;
            max-width: 400px;
        }
        .btn-whatsapp {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            background: #25D366;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 50px;
            font-size: 18px;
            transition: 0.3s;
        }
        .btn-whatsapp:hover {
            background: #128C7E;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="card">
        <h2 style="color: var(--gold);">¡Datos Recibidos!</h2>
        <p>Para abrir WhatsApp Web y coordinar tu sesión con Sergio, presiona el botón de abajo:</p>
        
        <a id="finalBtn" class="btn-whatsapp" href="#">ABRIR WHATSAPP WEB</a>
    </div>

    <script>
        // 1. EXTRAER DATOS DE LA URL (Esto sobrevive al cambio de dominio)
        const params = new URLSearchParams(window.location.search);
        
        const nombre = params.get('nom') || 'Cliente';
        const mancia = params.get('man') || 'Lectura';
        const numero = params.get('num') || '';

        // 2. CONSTRUIR EL MENSAJE
        let texto = `Hola Sergio, soy ${nombre}.\nHe confirmado mi pago para mi lectura de ${mancia}.\n`;
        if(numero) texto += `Mi numerología es: ${numero}.\n`;
        texto += `Estoy listo para coordinar por aquí.`;

        const mensajeFinal = encodeURIComponent(texto);
        
        // 3. ASIGNAR AL BOTÓN (Forzamos WhatsApp Web para PC)
        const btn = document.getElementById('finalBtn');
        btn.href = `https://web.whatsapp.com/send?phone=59894140917&text=${mensajeFinal}`;

        // 4. AUTO-REDIRECCIÓN (Como respaldo, si el PC lo permite)
        setTimeout(() => {
            window.location.href = btn.href;
        }, 2000);
    </script>
</body>
</html>
