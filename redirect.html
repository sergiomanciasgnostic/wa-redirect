<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sergiomancias Gnostic | WhatsApp</title>
  <style>
    /* Estilos visuales originales preservados */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #442565; color: #fff; font-family: 'Segoe UI', Arial, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; text-align: center; padding: 24px;
    }
    .card {
      background: #3a1f57; border: 1px solid rgba(255,106,0,0.35);
      padding: 40px 32px; max-width: 340px; width: 100%;
      border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .sigilo {
      width: 90px; height: 90px; object-fit: contain; margin: 0 auto 20px; display: block;
    }
    h2 { font-size: 22px; color: #FF6A00; margin-bottom: 8px; }
    p { color: #d4b8f0; font-size: 15px; margin-bottom: 16px; line-height: 1.4; }
    .separador { border-top: 1px solid rgba(255,106,0,0.35); margin: 20px 0; }
    .btn-wrap {
      display: flex; align-items: center; gap: 12px; margin-top: 10px;
    }
    .wa-icon { width: 42px; height: 42px; flex-shrink: 0; }
    .btn {
      display: flex; align-items: center; justify-content: center;
      flex: 1; padding: 14px 10px;
      background: #25D366; color: #fff; font-size: 15px;
      font-weight: bold; text-decoration: none;
      border-radius: 8px; cursor: pointer;
      transition: background 0.3s ease;
    }
    .btn:hover { background: #1ebe57; }
  </style>
</head>
<body>

  <div class="card">
    <img class="sigilo" src="https://static.wixstatic.com/media/4c70c8_89b322a9983548539f2997a6cec3cf3b~mv2.png" alt="Sergiomancias Gnostic" />
    
    <h2>¡Todo listo!</h2>
    <p>Prepárate para tu lectura con <br><strong style="color:#fff">Sergiomancias Gnostic</strong>.</p>
    
    <div class="separador"></div>
    
    <p>Si no eres redirigido automáticamente, toca el botón para abrir WhatsApp.</p>
    
    <div class="btn-wrap">
      <svg class="wa-icon" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <circle cx="24" cy="24" r="24" fill="#25D366"/>
        <path fill="#fff" d="M34.5 13.5A14.9 14.9 0 0 0 24 9C15.7 9 9 15.7 9 24c0 2.6.7 5.2 2 7.4L9 39l7.8-2A14.9 14.9 0 0 0 24 39c8.3 0 15-6.7 15-15 0-4-1.6-7.8-4.5-10.5zm-10.5 23a12.4 12.4 0 0 1-6.3-1.7l-.5-.3-4.6 1.2 1.2-4.5-.3-.5A12.4 12.4 0 0 1 11.6 24c0-6.8 5.6-12.4 12.4-12.4 3.3 0 6.4 1.3 8.8 3.6a12.3 12.3 0 0 1 3.6 8.8c0 6.9-5.5 12.5-12.4 12.5zm6.8-9.3c-.4-.2-2.2-1.1-2.6-1.2-.4-.1-.6-.2-.9.2-.3.4-1 1.2-1.2 1.5-.2.3-.5.3-.9.1-.4-.2-1.6-.6-3-1.9-1.1-1-1.9-2.2-2.1-2.6-.2-.4 0-.6.2-.8l.6-.7c.2-.2.2-.4.4-.6.1-.2.1-.4 0-.6-.1-.2-.9-2.1-1.2-2.9-.3-.7-.6-.6-.9-.7h-.7c-.3 0-.7.1-1 .4-.4.4-1.4 1.4-1.4 3.3s1.4 3.8 1.6 4.1c.2.3 2.8 4.2 6.7 5.9 4 1.7 4 1.1 4.7 1 .7-.1 2.2-.9 2.5-1.7.3-.9.3-1.6.2-1.8-.1-.2-.4-.3-.8-.5z"/>
      </svg>
      <a id="waBtn" class="btn" href="#">Ir a WhatsApp</a>
    </div>
  </div>

  <script>
    const PHONE_NUMBER = '59894140917';

    function generarMensajeWhatsApp() {
      try {
        // 1. Intentar capturar mensaje previo si viene por URL
        const params = new URLSearchParams(window.location.search);
        let mensajeCuerpo = params.get('msg') ? decodeURIComponent(params.get('msg')).replace(/\\n/g, '\n') : "";

        // 2. Si no hay mensaje en URL, reconstruir desde localStorage[cite: 1]
        if (!mensajeCuerpo) {
          const nombre = localStorage.getItem('nombre') || '';
          const apellido = localStorage.getItem('apellido') || '';
          const dia = localStorage.getItem('dia') || '';
          const mes = localStorage.getItem('mes') || '';
          const anio = localStorage.getItem('anio') || '';
          const sexo = localStorage.getItem('sexo') || 'H';
          const mancia = localStorage.getItem('mancia') || '';
          const minutos = localStorage.getItem('minutos') || '0';
          const numero = localStorage.getItem('numerologia') || '';
          const zodiaco = localStorage.getItem('zodiaco') || '';
          const descuento = localStorage.getItem('descuento') || '0';
          const extra = localStorage.getItem('extra') || '';
          const tipoPago = localStorage.getItem('tipoPago') || '';
          const tarjeta = localStorage.getItem('tarjeta') || '';
          
          // Datos específicos de Astrología
          const pais = localStorage.getItem('pais') || '';
          const provincia = localStorage.getItem('provincia') || '';
          const ciudad = localStorage.getItem('ciudad') || '';
          const hora = localStorage.getItem('hora') || '';

          const mesesNombres = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
          const nombreMes = mesesNombres[parseInt(mes) - 1] || '';

          // Lógica de personalización por género[cite: 1]
          const despedida = sexo === 'H' ? 'Estoy listo para coordinar mi lectura, gracias.' : 'Estoy lista para coordinar mi lectura, gracias.';
          
          // Formateo de secciones opcionales
          const mensajeZodiaco = zodiaco ? `Soy del signo ${zodiaco}\n` : '';
          const mensajeDesc = parseInt(descuento) > 0 ? `Descuento aplicado: ${descuento}%\n` : '';
          const mensajeExtra = extra ? `2x1 con: ${extra}\n` : '';
          
          let mensajePago = '';
          if (tipoPago === 'PayPal') mensajePago = `Pagué por: *PayPal*\n`;
          else if (tipoPago === 'Transferencia' && tarjeta) mensajePago = `Pagaré por transferencia con: *${tarjeta}*\n`;

          let mensajeAstro = '';
          if (mancia === 'Astrología') {
            mensajeAstro = `\n*Datos de Astrología*\nLugar: ${ciudad}, ${provincia}, ${pais}\nHora: ${hora}\n`;
          }

          // Construcción del mensaje final[cite: 1]
          mensajeCuerpo = 
            `Hola, Sergiomancias Gnostic.\n¡Pago confirmado!\nAquí están mis datos:\n\n` +
            `*Datos personales*\n_${nombre} ${apellido}_\n` +
            `Nací el ${dia} de ${nombreMes} de ${anio}\n` +
            `Mi numerología es ${numero}\n` + mensajeZodiaco +
            `\n*Datomancia*\n${mancia}\n` + mensajeExtra +
            `Duración de la lectura: ${minutos} minutos\n` + mensajeDesc + mensajePago +
            mensajeAstro +
            `\n${despedida}`;
        }

        const urlFinal = `https://api.whatsapp.com/send?phone=${PHONE_NUMBER}&text=${encodeURIComponent(mensajeCuerpo)}`;
        
        // Actualizar el enlace del botón
        const btn = document.getElementById('waBtn');
        btn.href = urlFinal;

        // Redirección automática tras un breve delay para permitir que la página cargue
        setTimeout(() => {
          window.location.href = urlFinal;
        }, 1000);

      } catch (error) {
        console.error("Error al procesar los datos:", error);
        // Fallback al WhatsApp genérico en caso de error crítico
        window.location.href = `https://api.whatsapp.com/send?phone=${PHONE_NUMBER}`;
      }
    }

    // Iniciar proceso al cargar la ventana
    window.onload = generarMensajeWhatsApp;
  </script>

</body>
</html>
