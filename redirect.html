<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Redirigiendo...</title>
  <style>
    body {
      background: #442565; color: #fff; font-family: Arial, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0;
    }
    .msg { text-align: center; }
    .msg p { color: #d4b8f0; margin-top: 8px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="msg">
    <div style="font-size:48px">💬</div>
    <p id="loading">Abriendo WhatsApp...</p>
    <a id="waLink" href="#" style="display:none; margin-top:16px; padding:12px 24px; background:#25D366; color:#fff; text-decoration:none; border-radius:6px; font-weight:bold;">
      Abrir WhatsApp
    </a>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const msg = params.get('msg');
    const phone = '59894140917';
    if (msg) {
      const url = 'https://wa.me/' + phone + '?text=' + msg;
      document.getElementById('waLink').href = url;
      document.getElementById('waLink').style.display = 'inline-block';
      document.getElementById('loading').style.display = 'none';
      // Intentar abrir automáticamente también
      window.open(url, '_blank');
    }
  </script>
</body>
</html>
