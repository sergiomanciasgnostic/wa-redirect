<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <style>
        body { background: #442565; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: sans-serif; }
        .btn { 
            background: #25D366; color: white; padding: 20px 40px; 
            text-decoration: none; font-weight: bold; border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <!-- Usamos la URL completa y directa en el href -->
    <a id="waBtn" class="btn" href="https://api.whatsapp.com/send?phone=59894140917">
        ABRIR WHATSAPP
    </a>

    <script>
        const params = new URLSearchParams(window.location.search);
        const msg = params.get('msg');
        if (msg) {
            const finalUrl = "https://api.whatsapp.com/send?phone=59894140917&text=" + msg;
            document.getElementById('waBtn').href = finalUrl;
            // Redirección inmediata
            window.location.href = finalUrl;
        }
    </script>
</body>
</html>
