<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Conectando con WhatsApp - Sergiomancias Gnostic</title>
    <style>
        body { background: #442565; color: white; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .loader { border: 4px solid rgba(255,106,0,0.1); border-left-color: #FF6A00; width: 40px; height: 40px; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn-manual { display: none; padding: 15px 25px; background: #25D366; color: white; text-decoration: none; font-weight: bold; border-radius: 50px; margin-top: 20px; transition: 0.3s; }
        .btn-manual:hover { background: #128C7E; transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h2 id="status">Abriendo WhatsApp Web...</h2>
    <p id="msg-info">Estamos procesando tu lectura esotérica.</p>
    
    <!-- Botón de respaldo por si el navegador bloquea el popup -->
    <a id="btnWA" class="btn-manual" href="#">ABRIR WHATSAPP MANUALMENTE</a>

    <script>
        // 1. CAPTURAR DATOS DE LA URL (Vienen de tu web principal)
        const params = new URLSearchParams(window.location.search);
        
        // Extraemos las variables que enviaste
        const nombre = params.get('nom') || 'Cliente';
        const mancia = params.get('man') || 'Lectura';
        const extra = params.get('ext') || '';
        const numero = params.get('num') || '';
        const total = params.get('min') || '';

        // 2. CONSTRUIR EL MENSAJE
        let texto = `Hola Sergio, soy ${nombre}.\n`;
        texto += `He confirmado mi pago para: ${mancia}${extra ? ' + ' + extra : ''}.\n`;
        if(numero) texto += `Mi numerología es: ${numero}.\n`;
        if(total) texto += `Duración: ${total} minutos.\n`;
        texto += `\nEstoy listo/a para coordinar.`;

        const mensajeFinal = encodeURIComponent(texto);
        const urlWA = `https://web.whatsapp.com/send?phone=59894140917&text=${mensajeFinal}`;
        // Nota: Usamos web.whatsapp.com para forzar la versión de escritorio en PC.

        // 3. INTENTAR APERTURA AUTOMÁTICA
        function abrirWhatsApp() {
            // Intentamos abrir en la misma pestaña para evitar bloqueos de popups
            window.location.href = urlWA;
        }

        // Ejecutar al cargar
        setTimeout(abrirWhatsApp, 1500);

        // 4. MOSTRAR BOTÓN SI TARDA (SEGURIDAD PARA PC)
        setTimeout(() => {
            const btn = document.getElementById('btnWA');
            const status = document.getElementById('status');
            btn.href = urlWA;
            btn.style.display = 'inline-block';
            status.innerText = "Si no abrió automáticamente:";
        }, 4000);
    </script>
</body>
</html>
