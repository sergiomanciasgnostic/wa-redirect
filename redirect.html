<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Confirmación Sergiomancias Gnostic</title>
    <style>
        body { 
            background: #442565; color: white; font-family: Arial, sans-serif; 
            display: flex; flex-direction: column; align-items: center; 
            justify-content: center; height: 100vh; margin: 0; text-align: center;
        }
        .boton-web {
            background: #25D366; color: white; padding: 20px 40px;
            text-decoration: none; font-weight: bold; border-radius: 10px;
            font-size: 20px; border: none; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .boton-web:hover { background: #128C7E; transform: scale(1.05); }
        p { margin-bottom: 30px; font-size: 18px; opacity: 0.9; }
    </style>
</head>
<body>

    <h2>¡Información Lista!</h2>
    <p>Haz clic abajo para abrir WhatsApp Web y coordinar con Sergio.</p>
    
    <a id="btnFinal" class="boton-web" href="#">ABRIR WHATSAPP EN ESTA PC</a>

    <script>
        // LEER LOS DATOS DESDE LA URL (Única forma que funciona en PC)
        const query = new URLSearchParams(window.location.search);
        const nombre = query.get('nom') || 'Cliente';
        const mancia = query.get('man') || 'Lectura';
        const num = query.get('num') || '';

        // CONSTRUIR EL MENSAJE
        let msg = `Hola Sergio, soy ${nombre}. He confirmado mi pago para mi lectura de ${mancia}.`;
        if(num) msg += ` Mi numerología es ${num}.`;
        msg += ` Quedo atento para coordinar.`;

        // EL ENLACE DE WHATSAPP WEB (Forzado para navegador)
        const urlFinal = "https://web.whatsapp.com/send?phone=59894140917&text=" + encodeURIComponent(msg);

        // PONER EL ENLACE EN EL BOTÓN
        document.getElementById('btnFinal').href = urlFinal;
    </script>
</body>
</html>
