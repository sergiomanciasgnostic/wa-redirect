<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lectura con Sergiomancias Gnostic</title>
    <style>
        body { background: #442565; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: sans-serif; }
        .btn { 
            background: #25D366; color: white; padding: 20px 40px; 
            text-decoration: none; font-weight: bold; border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- El botón por defecto lleva solo el número -->
    <a id="waBtn" class="btn" href="https://api.whatsapp.com/send?phone=59894140917">
        ABRIR WHATSAPP
    </a>

    <script>
        const params = new URLSearchParams(window.location.search);
        let msg = params.get('msg');
        const phone = "59894140917";

        if (msg) {
            // 1. Decodificamos el mensaje que viene de la URL
            let textoLimpio = decodeURIComponent(msg);

            // 2. REPARACIÓN: Reemplazamos cualquier "\n" literal por un salto de línea real
            // Esto es lo que separa los párrafos en WhatsApp
            textoLimpio = textoLimpio.replace(/\\n/g, '\n');

            // 3. Construimos la URL final codificando el texto ya reparado
            const finalUrl = "https://api.whatsapp.com/send?phone=" + phone + "&text=" + encodeURIComponent(textoLimpio);
            
            // Actualizamos el botón y redirigimos
            document.getElementById('waBtn').href = finalUrl;
            window.location.href = finalUrl;
        }
    </script>
</body>
</html>
