<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verificación de Datos – Sergiomancias Gnostic</title>
  <style>
    :root {
      --gold: #FF6A00;
      --dark: #442565;
      --dark-card: #3a1f57;
      --text-muted: #d4b8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--dark); color: #fff; font-family: Arial, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
    }
    .container {
      display: flex; flex-wrap: wrap; gap: 20px;
      max-width: 800px; width: 100%;
    }
    .card {
      background: var(--dark-card); border: 1px solid rgba(255,106,0,0.3);
      padding: 25px; flex: 1; min-width: 300px; border-radius: 12px;
      text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    h3 {
      color: var(--gold); font-size: 14px; text-transform: uppercase;
      margin-bottom: 15px; border-bottom: 1px solid rgba(255,106,0,0.2);
      padding-bottom: 5px; text-align: left;
    }
    .data-list { list-style: none; text-align: left; font-size: 14px; }
    .data-list li {
      margin-bottom: 10px; display: flex; justify-content: space-between;
      color: var(--text-muted); border-bottom: 1px solid rgba(255,255,255,0.05);
      padding-bottom: 4px;
    }
    .data-list span { color: #fff; font-weight: bold; text-align: right; }
    .btn-wa {
      display: block; background: #25D366; color: #fff; text-decoration: none;
      padding: 15px; border-radius: 50px; font-weight: bold; margin-top: 20px;
      transition: 0.3s; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
    }
    .btn-wa:hover { background: #1ebe57; transform: translateY(-2px); }
    .logo { width: 70px; margin-bottom: 10px; }
    #errorMsg { color: var(--gold); font-weight: bold; display: none; text-align: center; width: 100%; }
  </style>
</head>
<body>

<div id="errorMsg">
    Error: No se recibieron datos. Vuelve a la página anterior e inténtalo de nuevo.
</div>

<div class="container" id="mainContent" style="display:none;">
  <!-- Panel de Verificación -->
  <div class="card">
    <h3>Verificación de Datos</h3>
    <ul class="data-list" id="previewList">
        <!-- Se llena automáticamente -->
    </ul>
  </div>

  <!-- Panel de Redirección -->
  <div class="card">
    <img class="logo" src="https://static.wixstatic.com/media/4c70c8_89b322a9983548539f2997a6cec3cf3b~mv2.png" alt="Logo">
    <h2 style="color:var(--gold); margin-bottom:10px;">¡Pago Confirmado!</h2>
    <p style="font-size:14px; color:var(--text-muted);">Estamos conectando con Sergiomancias Gnostic...</p>
    <a id="waBtn" class="btn-wa" href="#">Enviar a WhatsApp</a>
  </div>
</div>

<script>
  window.onload = function() {
    const params = new URLSearchParams(window.location.search);
    
    // Extraemos el mensaje completo que generó tu código original
    const mensajeWA = params.get('msj');

    if (mensajeWA) {
      document.getElementById('mainContent').style.display = 'flex';
      
      // Decodificamos el mensaje para extraer los datos de la lista visual
      const textoLimpio = decodeURIComponent(mensajeWA);
      
      // Función para extraer valores entre líneas para la vista previa
      const extraer = (regex) => {
        const match = textoLimpio.match(regex);
        return match ? match[1].replace(/_/g, '').trim() : null;
      };

      // Llenamos la lista de verificación extrayendo del mensaje original[cite: 4]
      const previewList = document.getElementById('previewList');
      const datos = [
        { label: "Cliente", value: extraer(/\*Datos personales\*\n(.*?)\n/) },
        { label: "Nacimiento", value: extraer(/Nací el (.*?)\n/) },
        { label: "Numerología", value: extraer(/Mi numerología es (.*?)\n/) },
        { label: "Servicio", value: extraer(/\*Datomancia\*\n(.*?)\n/) },
        { label: "Duración", value: extraer(/Duración de la lectura: (.*?)\n/) }
      ];

      previewList.innerHTML = datos
        .filter(d => d.value)
        .map(d => `<li>${d.label}: <span>${d.value}</span></li>`)
        .join('');

      // Configuramos el enlace final de WhatsApp
      const phone = "59894140917";
      const waUrl = /Android|iPhone|iPad/i.test(navigator.userAgent)
        ? `https://api.whatsapp.com/send?phone=${phone}&text=${encodeURIComponent(textoLimpio)}`
        : `https://web.whatsapp.com/send?phone=${phone}&text=${encodeURIComponent(textoLimpio)}`;

      document.getElementById('waBtn').href = waUrl;

      // Redirección automática en 3 segundos para que vean la lista
      setTimeout(() => { window.location.href = waUrl; }, 3000);

    } else {
      document.getElementById('errorMsg').style.display = 'block';
    }
  };
</script>
</body>
</html>
