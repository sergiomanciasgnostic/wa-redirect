<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verificación – Sergiomancias Gnostic</title>
  <style>
    :root { --gold: #FF6A00; --dark: #442565; --dark-card: #3a1f57; --text-muted: #d4b8f0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--dark); color: #fff; font-family: Arial, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .container { display: flex; flex-wrap: wrap; gap: 20px; max-width: 800px; width: 100%; }
    .card { background: var(--dark-card); border: 1px solid rgba(255,106,0,0.3); padding: 25px; flex: 1; min-width: 300px; border-radius: 12px; text-align: center; }
    h3 { color: var(--gold); font-size: 14px; text-transform: uppercase; margin-bottom: 15px; border-bottom: 1px solid rgba(255,106,0,0.2); padding-bottom: 5px; text-align: left; }
    .data-list { list-style: none; text-align: left; font-size: 14px; }
    .data-list li { margin-bottom: 10px; display: flex; justify-content: space-between; color: var(--text-muted); border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 4px; }
    .data-list span { color: #fff; font-weight: bold; text-align: right; margin-left: 10px; }
    .btn-wa { display: block; background: #25D366; color: #fff; text-decoration: none; padding: 15px; border-radius: 50px; font-weight: bold; margin-top: 20px; transition: 0.3s; }
    .logo { width: 70px; margin-bottom: 10px; }
  </style>
</head>
<body>

<div id="errorMsg" style="display:none; text-align:center;">
    <h2 style="color:var(--gold);">Error de Datos</h2>
    <p>No pudimos recuperar tu información. Por favor, vuelve a completar el formulario.</p>
    <a href="javascript:history.back()" style="color:#fff; text-decoration:underline; margin-top:20px; display:block;">Volver atrás</a>
</div>

<div class="container" id="mainContent" style="display:none;">
  <div class="card">
    <h3>Lista de Verificación</h3>
    <ul class="data-list" id="previewList"></ul>
  </div>

  <div class="card">
    <img class="logo" src="https://static.wixstatic.com/media/4c70c8_89b322a9983548539f2997a6cec3cf3b~mv2.png">
    <h2 style="color:var(--gold); margin-bottom:10px;">¡Datos Verificados!</h2>
    <p style="font-size:14px; color:var(--text-muted); margin-bottom:20px;">Redirigiendo a WhatsApp para coordinar tu lectura...</p>
    <a id="waBtn" class="btn-wa" href="#">Abrir WhatsApp Ahora</a>
  </div>
</div>

<script>
  window.onload = function() {
    // Buscamos la info en el almacenamiento local
    const mensajeFinal = localStorage.getItem('mensajeWhatsApp');

    if (mensajeFinal) {
      document.getElementById('mainContent').style.display = 'flex';
      
      // Función para extraer datos del texto para la lista visual
      const extraer = (regex) => {
        const match = mensajeFinal.match(regex);
        return match ? match[1].replace(/_/g, '').trim() : "---";
      };

      const lista = document.getElementById('previewList');
      lista.innerHTML = `
        <li>Nombre: <span>${extraer(/\*Datos personales\*\n(.*?)\n/)}</span></li>
        <li>Nacimiento: <span>${extraer(/Nací el (.*?)\n/)}</span></li>
        <li>Mancia: <span>${extraer(/\*Datomancia\*\n(.*?)\n/)}</span></li>
        <li>Duración: <span>${extraer(/Duración de la lectura: (.*?)\n/)}</span></li>
      `;

      const phone = "59894140917";
      const waUrl = `https://wa.me/${phone}?text=${encodeURIComponent(mensajeFinal)}`;
      document.getElementById('waBtn').href = waUrl;

      // Auto-redirección en 3 segundos
      setTimeout(() => { window.location.href = waUrl; }, 3000);
    } else {
      document.getElementById('errorMsg').style.display = 'block';
    }
  };
</script>
</body>
</html>
