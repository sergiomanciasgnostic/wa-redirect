<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sergiomancias Gnostic - Redirección</title>
  <style>
    :root { --gold: #FF6A00; --dark: #442565; --card: #3a1f57; --text: #d4b8f0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--dark); color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .container { display: flex; flex-wrap: wrap; gap: 20px; max-width: 800px; width: 100%; }
    .card { background: var(--card); border: 1px solid rgba(255,106,0,0.3); padding: 30px; flex: 1; min-width: 300px; border-radius: 15px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h3 { color: var(--gold); font-size: 14px; text-transform: uppercase; margin-bottom: 15px; border-bottom: 1px solid rgba(255,106,0,0.2); padding-bottom: 5px; text-align: left; }
    .data-list { list-style: none; text-align: left; font-size: 15px; }
    .data-list li { margin-bottom: 12px; display: flex; justify-content: space-between; color: var(--text); border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 5px; }
    .data-list span { color: #fff; font-weight: bold; }
    .btn-wa { display: block; background: #25D366; color: #fff; text-decoration: none; padding: 16px; border-radius: 50px; font-weight: bold; margin-top: 25px; transition: 0.3s; font-size: 18px; }
    .btn-wa:hover { background: #1ebe57; transform: scale(1.03); }
    .logo { width: 80px; margin-bottom: 15px; }
  </style>
</head>
<body>

<div class="container" id="main" style="display:none;">
  <div class="card">
    <h3>Confirma tu información</h3>
    <ul class="data-list" id="preview"></ul>
  </div>

  <div class="card">
    <img class="logo" src="https://static.wixstatic.com/media/4c70c8_89b322a9983548539f2997a6cec3cf3b~mv2.png">
    <h2 style="color:var(--gold); margin-bottom:10px;">¡Datos Listos!</h2>
    <p style="color:var(--text); font-size:14px;">Redirigiendo a WhatsApp en 3 segundos...</p>
    <a id="linkWA" class="btn-wa" href="#">Enviar a WhatsApp</a>
  </div>
</div>

<div id="error" style="display:none; text-align:center;">
    <h2 style="color:var(--gold);">Error de Datos</h2>
    <p>No recibimos información del formulario.</p>
    <a href="https://sergiomanciasgnostic.com" style="color:#fff; display:block; margin-top:20px;">Volver al inicio</a>
</div>

<script>
  window.onload = function() {
    const params = new URLSearchParams(window.location.search);
    const rawData = params.get('data');

    if (rawData) {
      document.getElementById('main').style.display = 'flex';
      const msg = decodeURIComponent(rawData);
      
      const extraer = (reg) => {
        const m = msg.match(reg);
        return m ? m[1].replace(/_/g, '').trim() : "No indicado";
      };

      // Mostramos la lista con tus datos reales
      document.getElementById('preview').innerHTML = `
        <li>Nombre: <span>${extraer(/\*Datos personales\*\n(.*?)\n/)}</span></li>
        <li>Nacimiento: <span>${extraer(/Nací el (.*?)\n/)}</span></li>
        <li>Servicio: <span>${extraer(/\*Datomancia\*\n(.*?)\n/)}</span></li>
        <li>Lectura: <span>${extraer(/Duración de la lectura: (.*?)\n/)}</span></li>
      `;

      const finalUrl = `https://wa.me/59894140917?text=${encodeURIComponent(msg)}`;
      document.getElementById('linkWA').href = finalUrl;

      setTimeout(() => { window.location.href = finalUrl; }, 3000);
    } else {
      document.getElementById('error').style.display = 'block';
    }
  };
</script>
</body>
</html>
